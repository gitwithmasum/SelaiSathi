version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: selaisathi_postgres
    restart: always
    environment:
      POSTGRES_USER: selai_user
      POSTGRES_PASSWORD: selai_secret_password
      POSTGRES_DB: selaisathi_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U selai_user -d selaisathi_db']
      interval: 5s
      timeout: 5s
      retries: 5

  # SelaiSathi Backend API Server
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: selaisathi_api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: 'postgresql://selai_user:selai_secret_password@postgres:5432/selaisathi_db?schema=public'
      JWT_SECRET: 'selaisathi-super-production-secret-jwt-key-2026'
      JWT_ACCESS_EXPIRY: '15m'
      JWT_REFRESH_EXPIRY: '30d'
      OTP_EXPIRY_MINUTES: '5'
      SMS_PROVIDER: 'CONSOLE' # Change to GREENWEB or REVE in production
      PUBLIC_TRACK_URL_BASE: 'https://selaisathi.com/track'
    ports:
      - '5000:5000'

volumes:
  postgres_data:
    driver: local
